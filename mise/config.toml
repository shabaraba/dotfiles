# mise global configuration
# Managed by dotfiles repository
#
# This file is deployed to ~/.config/mise/config.toml
# Tasks defined here are available from any directory

[env]
# Resolve from the config's real path, including when deployed as a symlink.
DOTFILES_DIR = "{{config_source | canonicalize | dirname | dirname}}"

[settings]
# Enable idiomatic version files for common tools
# This allows mise to read .node-version, .python-version, etc. in other projects
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go", "java"]

# =============================================================================
# Default Tool Versions (for dotfiles repository development)
# =============================================================================
[tools]
node = "lts"
python = "3.13"
go = "latest"
pnpm = "latest"  # Package manager - minimum 10.27.0
deno = "latest"  # Required by peek.nvim (markdown preview)
actionlint = "latest"

# Development CLIs; Homebrew owns system packages and applications.
gh = "latest"
jq = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
bat = "latest"
delta = "latest"
jj = "latest"
zoxide = "latest"
lsd = "latest"
peco = "latest"
stylua = "latest"
black = "latest"
tree-sitter = "latest"
uv = "latest"
awscli = "latest"
terraform = "1.5.7"
cmake = "latest"
gradle = "latest"
cloudflared = "latest"
"npm:eslint_d" = "15"
"npm:yarn" = "1.22"

# Python CLIs use uv internally; their versions are managed by mise.
"pypi:graphifyy" = { version = "latest", python = "3.13" }
"pypi:mlx-lm" = { version = "latest", python = "3.13", os = ["macos/arm64"] }
"pypi:mlx-vlm" = { version = "latest", python = "3.13", os = ["macos/arm64"] }

# =============================================================================
# Global Tasks (available from anywhere)
# =============================================================================

[tasks.deploy]
description = "Deploy dotfiles symlinks to home directory"
run = "bash deployer.sh"
dir = "{{env.DOTFILES_DIR}}"

[tasks."dotfiles:update"]
description = "Update dotfiles from git and redeploy"
run = """
git pull origin main
bash deployer.sh
"""
dir = "{{env.DOTFILES_DIR}}"

[tasks."dotfiles:status"]
description = "Show git status of dotfiles"
run = "git status"
dir = "{{env.DOTFILES_DIR}}"

[tasks."brew:update"]
description = "Install Brewfile packages and update Homebrew packages, including HEAD builds"
run = """
brew update
brew bundle install --no-upgrade --file=installers/Brewfile
brew upgrade --fetch-HEAD
brew cleanup
"""
dir = "{{env.DOTFILES_DIR}}"

[tasks."tools:install"]
description = "Install development tools managed by mise"
run = "mise install"
dir = "{{env.DOTFILES_DIR}}"

[tasks."tools:update"]
description = "Update mise tools, Homebrew packages, and shell plugins"
run = """
mise upgrade --no-prune
mise run brew:update
sheldon lock --update
"""
dir = "{{env.DOTFILES_DIR}}"

[tasks."tools:migrate"]
description = "Remove migrated duplicate installations after verification"
run = "bash mise/scripts/consolidate-tools.sh"
dir = "{{env.DOTFILES_DIR}}"

[tasks."brew:dump"]
description = "Export a Homebrew snapshot for review (does not overwrite managed Brewfiles)"
run = "brew bundle dump --force --describe --file=installers/Brewfile.snapshot"
dir = "{{env.DOTFILES_DIR}}"

[tasks."brew:check"]
description = "Check if all Brewfile packages are installed"
run = "brew bundle check --file=installers/Brewfile.common"
dir = "{{env.DOTFILES_DIR}}"

[tasks."cache:clean"]
description = "Clean system caches"
run = """
echo "Cleaning Homebrew cache..."
brew cleanup -s
echo "Cleaning npm cache..."
npm cache clean --force 2>/dev/null || true
echo "Cleaning Python cache..."
find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
echo "Done!"
"""

[tasks.myip]
description = "Show my public IP address"
run = "curl -s ifconfig.me && echo"

[tasks.ports]
description = "List all listening ports"
run = "lsof -i -P | grep LISTEN"

[tasks."dns:flush"]
description = "Flush DNS cache (macOS)"
run = """
sudo dscacheutil -flushcache
sudo killall -HUP mDNSResponder
echo "DNS cache flushed"
"""

[tasks."git:cleanup"]
description = "Clean up merged git branches"
run = """
echo "Deleting merged branches..."
git branch --merged | grep -v '\\*\\|main\\|master\\|develop' | xargs -n 1 git branch -d
echo "Done!"
"""

[tasks.sysinfo]
description = "Show system information"
run = """
echo "=== System Info ==="
echo "OS: $(uname -s) $(uname -r)"
echo "Node: $(node -v 2>/dev/null || echo 'not installed')"
echo "Python: $(python --version 2>/dev/null || echo 'not installed')"
echo "mise: $(mise --version)"
echo "Homebrew: $(brew --version | head -n 1)"
"""

# =============================================================================
# Local Gitea → GitHub PR Workflow
# =============================================================================

[tasks."pr:publish"]
description = "Publish a local Gitea PR to GitHub as a draft PR"
run = "bash \"$DOTFILES_DIR/mise/scripts/pr-publish.sh\" \"$@\""

# =============================================================================
# GitHub Repository Setup Tasks
# =============================================================================

[tasks."gh:repo-init"]
description = "Initialize repository with release-please and branch protection"
run = "bash \"$DOTFILES_DIR/mise/scripts/gh-repo-init.sh\" \"$@\""

[tasks."gh:repo-init:workflow"]
description = "Create release-please workflow file only"
run = "bash \"$DOTFILES_DIR/mise/scripts/gh-repo-init-workflow.sh\""

[tasks."gh:repo-init:config"]
description = "Create release-please config files only"
run = "bash \"$DOTFILES_DIR/mise/scripts/gh-repo-init-config.sh\" \"$@\""

[tasks."gh:repo-init:hook"]
description = "Setup pre-commit hook to prevent commits to main"
run = "bash \"$DOTFILES_DIR/mise/scripts/gh-repo-init-hook.sh\""

[tasks."gh:repo-init:protect"]
description = "Setup GitHub repository protection settings"
run = "bash \"$DOTFILES_DIR/mise/scripts/gh-repo-init-protect.sh\""
